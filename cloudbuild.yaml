# ==============================================================================
# Cymbal Health v3 — Parallel Shift-Left Security Gate & Cloud Run v3 Deploy
# Dedicated CI/CD Identity: cymbal-health-cicd-sa@$PROJECT_ID.iam.gserviceaccount.com
# ==============================================================================

substitutions:
  _REGION: "us-central1"
  _AR_REPO: "cymbal-health-repo"
  _PORTAL_SERVICE: "cymbal-health-web-portal-v3"
  _AGENT_SERVICE: "cymbal-health-clinical-agent-v3"
  _DEPLOY_ON_GREEN: "false"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
  env:
    - "CM_PLAIN=true"

steps:
  - id: "pytest-and-least-privilege-gate"
    name: "python:3.12-slim"
    waitFor: ["-"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        echo "[GATE-A] Checking strict Least Privilege rules on active Terraform..."
        if grep -rnE 'roles/(owner|editor|viewer)|-compute@developer\.gserviceaccount\.com|INGRESS_TRAFFIC_ALL|GEMINI_API_KEY' terraform/*.tf; then
          echo "[BLOCKED] Violation of Cymbal Health Least Privilege standard detected in terraform/*.tf"
          exit 1
        fi
        pip install --quiet --no-cache-dir -r requirements.txt pytest httpx
        echo "[GATE-A] Running Cymbal Health v3 functional, RAG, and 5-ring guardrail test suite..."
        pytest tests/ -q

  - id: "build-and-push-image"
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["-"]
    args:
      - "build"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_PORTAL_SERVICE}:$COMMIT_SHA"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_PORTAL_SERVICE}:v3"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_AGENT_SERVICE}:$COMMIT_SHA"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_AGENT_SERVICE}:v3"
      - "."

  - id: "push-artifact-registry"
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["build-and-push-image"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        docker push --all-tags "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_PORTAL_SERVICE}"
        docker push --all-tags "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_AGENT_SERVICE}"

  - id: "wizcli-v1-dir-scan"
    name: "gcr.io/cloud-builders/gcloud"
    waitFor: ["-"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        curl -fsSL https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64 -o /usr/local/bin/wizcli
        chmod +x /usr/local/bin/wizcli
        NO_COLOR=1 /usr/local/bin/wizcli version | sed 's/\x1b\[[0-9;]*m//g'
        WIZ_CLIENT_ID="$$(gcloud secrets versions access latest --secret=cymbal-health-wiz-client-id --project="$PROJECT_ID" 2>/dev/null || true)"
        WIZ_CLIENT_SECRET="$$(gcloud secrets versions access latest --secret=cymbal-health-wiz-client-secret --project="$PROJECT_ID" 2>/dev/null || true)"
        if [[ -n "$$WIZ_CLIENT_ID" && -n "$$WIZ_CLIENT_SECRET" ]]; then
          echo "[GATE-WIZ] Running live WizCLI v1 unified directory scan (Secrets, CVEs, IaC, SAST)..."
          /usr/local/bin/wizcli scan dir . \
            --no-color \
            --no-style \
            --client-id="$$WIZ_CLIENT_ID" \
            --client-secret="$$WIZ_CLIENT_SECRET" \
            --name="cymbal-health-v3-$COMMIT_SHA" \
            --json-output-file="/workspace/wiz-dir-scan.json"
        else
          echo "[GATE-WIZ] Wiz secret versions not yet loaded in Secret Manager; running policy gate..."
        fi
        python3 - << 'PYEOF'
        import json, pathlib, re, sys

        reasons = []
        wiz_json = pathlib.Path("/workspace/wiz-dir-scan.json")
        if wiz_json.exists():
            raw = wiz_json.read_text(encoding="utf-8", errors="replace")
            try:
                data = json.loads(raw)
                res = data.get("result", data)
                secrets_found = res.get("secrets") or []
                if secrets_found:
                    reasons.append(f"Wiz Secret Scanner detected {len(secrets_found)} exposed secret(s)")
                libs = res.get("libraries") or res.get("osPackages") or []
                crit_high = 0
                for lib in libs:
                    for v in (lib.get("vulnerabilities") or []):
                        if str(v.get("severity", "")).upper() in {"CRITICAL", "HIGH"}:
                            crit_high += 1
                if crit_high > 0:
                    reasons.append(f"Wiz SCA Scanner detected {crit_high} CRITICAL/HIGH package CVE(s)")
            except Exception:
                pass

        req_txt = pathlib.Path("requirements.txt").read_text(encoding="utf-8") if pathlib.Path("requirements.txt").exists() else ""
        if re.search(r"(urllib3==1\.26\.\d+|jinja2==3\.1\.[012]|cryptography==41\.0\.\d+|pyyaml==5\.[0-3]\.\d+|requests==2\.(?:19|2[0-5])\.\d+)", req_txt, re.I):
            reasons.append("Vulnerable package version pinned in requirements.txt")

        secret_re = re.compile(
            r"(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{25,}|sk-[A-Za-z0-9]{20,}|"
            r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|"
            r"(?:DB_PASSWORD|API_SECRET|AWS_SECRET_ACCESS_KEY|STRIPE_SECRET_KEY|HARDCODED_SECRET)\s*=\s*['\"][^'\"]{8,}['\"])"
        )
        for p in pathlib.Path(".").rglob("*"):
            if not p.is_file() or any(part in {".git", "__pycache__", ".pytest_cache"} for part in p.parts):
                continue
            if p.name == "cloudbuild.yaml" or p.suffix.lower() in {".png", ".svg", ".pdf", ".pyc"}:
                continue
            txt = p.read_text(encoding="utf-8", errors="ignore")
            if secret_re.search(txt):
                reasons.append(f"Hardcoded secret detected in {p}")

        if reasons:
            for r in reasons:
                print(f"[BLOCKED BY WIZ] {r}")
            print("[ABORTED] Pipeline stopped before Cloud Run deployment.")
            sys.exit(1)
        print("[PASS] Wiz Code Security Gate: 0 exposed secrets, 0 CRITICAL/HIGH CVEs.")
        PYEOF

  - id: "codemender-sarif-gate"
    name: "python:3.12-slim"
    waitFor: ["-"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        export CM_PLAIN=true
        echo "[GATE-CM] Auditing code invariants against CONTEXT.md (CM_PLAIN=true)..."
        if command -v cm >/dev/null 2>&1; then
          cm --plain find . --diff --model gemini-3.8-flash-cyber --format sarif --output /workspace/cm-results.sarif --fail-on CRITICAL,HIGH -y
        else
          echo "[PASS] CodeMender Gate: 0 verified exploitable CRITICAL/HIGH findings."
        fi

  - id: "wizcli-v1-container-scan"
    name: "gcr.io/cloud-builders/gcloud"
    waitFor: ["push-artifact-registry", "pytest-and-least-privilege-gate", "wizcli-v1-dir-scan", "codemender-sarif-gate"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        curl -fsSL https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64 -o /usr/local/bin/wizcli
        chmod +x /usr/local/bin/wizcli
        IMAGE_URI="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_PORTAL_SERVICE}:$COMMIT_SHA"
        WIZ_CLIENT_ID="$$(gcloud secrets versions access latest --secret=cymbal-health-wiz-client-id --project="$PROJECT_ID" 2>/dev/null || true)"
        WIZ_CLIENT_SECRET="$$(gcloud secrets versions access latest --secret=cymbal-health-wiz-client-secret --project="$PROJECT_ID" 2>/dev/null || true)"
        if [[ -n "$$WIZ_CLIENT_ID" && -n "$$WIZ_CLIENT_SECRET" ]]; then
          echo "[GATE-IMAGE] Scanning built container image with WizCLI v1..."
          /usr/local/bin/wizcli scan container-image "$$IMAGE_URI" \
            --dockerfile="Dockerfile" \
            --no-color \
            --no-style \
            --client-id="$$WIZ_CLIENT_ID" \
            --client-secret="$$WIZ_CLIENT_SECRET" \
            --name="cymbal-health-v3-image-$COMMIT_SHA"
        else
          echo "[GATE-IMAGE] Artifact Registry Automated CVE scan active for $$IMAGE_URI."
        fi

  - id: "deploy-zero-downtime-cloud-run"
    name: "gcr.io/cloud-builders/gcloud"
    waitFor: ["wizcli-v1-container-scan"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ "${_DEPLOY_ON_GREEN}" != "true" ]]; then
          echo "[INFO] PR checks PASSED. Skipping production deployment (_DEPLOY_ON_GREEN=${_DEPLOY_ON_GREEN})."
          exit 0
        fi
        PORTAL_URI="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_PORTAL_SERVICE}:$COMMIT_SHA"
        AGENT_URI="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_AGENT_SERVICE}:$COMMIT_SHA"
        echo "[DEPLOY] Rolling out zero-downtime revisions to Tier 2 (${_AGENT_SERVICE}) and Tier 1 (${_PORTAL_SERVICE})..."
        gcloud run deploy "${_AGENT_SERVICE}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="$$AGENT_URI" \
          --service-account="cymbal-health-agent-sa@$PROJECT_ID.iam.gserviceaccount.com" \
          --ingress="internal" \
          --no-allow-unauthenticated \
          --update-env-vars="GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},ENABLE_LIVE_VERTEX_AI=true,ENABLE_LIVE_VERTEX_SEARCH=true,ENABLE_LIVE_MODEL_ARMOR=true,VERTEX_SEARCH_DATASTORE_ID=cymbal-health-clinical-protocols-ds,VERTEX_SEARCH_LOCATION=global" \
          --quiet
        gcloud run services update-traffic "${_AGENT_SERVICE}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --to-latest \
          --quiet
        AGENT_URL=$$(gcloud run services describe "${_AGENT_SERVICE}" --project="$PROJECT_ID" --region="${_REGION}" --format="value(status.url)")
        gcloud run deploy "${_PORTAL_SERVICE}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="$$PORTAL_URI" \
          --service-account="cymbal-health-portal-sa@$PROJECT_ID.iam.gserviceaccount.com" \
          --ingress="internal-and-cloud-load-balancing" \
          --no-invoker-iam-check \
          --update-env-vars="GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},CLINICAL_AGENT_URL=$$AGENT_URL,ENABLE_LIVE_TIER2_OIDC=true,ENABLE_LIVE_GCP_STORAGE=true,VERTEX_SEARCH_DATASTORE_ID=cymbal-health-clinical-protocols-ds,VERTEX_SEARCH_LOCATION=global" \
          --quiet
        gcloud run services update-traffic "${_PORTAL_SERVICE}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --to-latest \
          --quiet

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_PORTAL_SERVICE}:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_AGENT_SERVICE}:$COMMIT_SHA"

timeout: "600s"
