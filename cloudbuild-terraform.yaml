# ==============================================================================
# Cymbal Health — Remote Terraform Execution Pipeline in Google Cloud Build
# Executes hashicorp/terraform:1.9.8 inside GCP using custom least-privilege SA
# cymbal-health-cicd-sa and isolated remote state bucket in Cloud Storage.
# ==============================================================================

substitutions:
  _TF_ACTION: "plan"
  _TF_STATE_BUCKET: "cymbal-health-tfstate-123456789012"
  _TF_STATE_PREFIX: "terraform/state/cymbal-health"
  _PROJECT_NUMBER: "123456789012"
  _REGION: "us-central1"
  _SQL_DELETION_PROTECTION: "true"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: "terraform-init-validate-execute"
    name: "hashicorp/terraform:1.9.8"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        set -eu
        echo "[TF] Initializing remote GCS backend gs://${_TF_STATE_BUCKET}/${_TF_STATE_PREFIX}..."
        terraform init \
          -input=false \
          -backend-config="bucket=${_TF_STATE_BUCKET}" \
          -backend-config="prefix=${_TF_STATE_PREFIX}"
        terraform fmt -check
        terraform validate

        COMMON_VARS="-var=project_id=$PROJECT_ID -var=project_number=${_PROJECT_NUMBER} -var=region=${_REGION} -var=sql_deletion_protection=${_SQL_DELETION_PROTECTION}"

        if [ "${_TF_ACTION}" = "apply" ] || [ "${_TF_ACTION}" = "plan" ]; then
          if ! terraform state show google_service_account.cicd_sa >/dev/null 2>&1; then
            terraform import $$COMMON_VARS google_service_account.cicd_sa \
              "projects/$PROJECT_ID/serviceAccounts/cymbal-health-cicd-sa@$PROJECT_ID.iam.gserviceaccount.com" || true
          fi
          if ! terraform state show google_artifact_registry_repository.repo >/dev/null 2>&1; then
            terraform import $$COMMON_VARS google_artifact_registry_repository.repo \
              "projects/$PROJECT_ID/locations/${_REGION}/repositories/cymbal-health-repo" || true
          fi
        fi

        case "${_TF_ACTION}" in
          plan)
            terraform plan -input=false $$COMMON_VARS -out=tfplan.binary
            ;;
          apply)
            terraform plan -input=false $$COMMON_VARS -out=tfplan.binary
            terraform apply -input=false -auto-approve tfplan.binary
            terraform output -json > /workspace/terraform_outputs.json
            ;;
          destroy)
            terraform state rm google_service_account.cicd_sa || true
            terraform apply -input=false -auto-approve $$COMMON_VARS \
              -var=sql_deletion_protection=false \
              -target=google_sql_database_instance.pg_main || true
            terraform destroy -input=false -auto-approve $$COMMON_VARS \
              -var=sql_deletion_protection=false
            ;;
          *)
            echo "[ERROR] Unsupported _TF_ACTION=${_TF_ACTION}. Allowed: plan | apply | destroy"
            exit 1
            ;;
        esac

timeout: "1800s"
